version: 2
updates:
  # RFCs are design experiments, not deployed code: no dependency PRs for them.
  # The ecosystem must be `uv` and the paths must match the real manifests,
  # or the block matches nothing and is silently ignored.
  - package-ecosystem: "uv"
    directories:
      - "/rfcs/*"
      - "/rfcs/**"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
